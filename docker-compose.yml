services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: comate
    ports:
      - "5432:5432"
    volumes:
      - comate_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d comate"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  comate_pgdata:
