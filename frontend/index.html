<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>CoMate - 팀원 모집</title>
  <style>
    * { box-sizing: border-box; font-family: 'Pretendard', sans-serif; }
    body { margin: 20px; background-color: #f4f6f8; color: #333; }
    
    .form-container { max-width: 800px; margin: 0 auto 30px auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    .form-container input, .form-container button { width: 100%; margin-bottom: 10px; padding: 10px; border: 1px solid #ddd; border-radius: 6px; }
    .dept-input-row { display: flex; gap: 8px; margin-bottom: 8px; }
    
    .card-container { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; max-width: 900px; margin: 0 auto; }
    .card { width: 320px; background: white; border-radius: 12px; padding: 18px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); }
    .card-title { font-size: 18px; font-weight: bold; margin: 5px 0; }
    .dept-list { background-color: #f8f9fa; padding: 10px; border-radius: 6px; margin-bottom: 12px; }
    .dept-item { display: flex; justify-content: space-between; align-items: center; font-size: 13px; margin-bottom: 6px; }
    .btn-dept-approve { background-color: #28a745; color: white; border: none; padding: 3px 8px; border-radius: 4px; font-size: 11px; cursor: pointer; }
    .btn-row { display: flex; gap: 5px; margin-top: 10px; }
    .btn { flex: 1; padding: 8px; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: bold; }
    .btn-edit { background-color: #ffc107; color: #212529; }
    .btn-del { background-color: #dc3545; color: white; }
  </style>
</head>
<body>

  <h1 style="text-align: center; color: #2c3e50;">CoMate 모집 게시판</h1>

  <div class="form-container">
    <h3>📢 새 모집글 작성하기</h3>
    <input type="text" id="title" placeholder="대회/공모전 제목">
    <input type="text" id="author" placeholder="작성자 이름">
    
    <label style="font-size: 13px; font-weight: bold;">모집 학과 및 인원 지정</label>
    <div id="deptInputGroup">
      <div class="dept-input-row">
        <input type="text" class="dept-name" placeholder="학과명 (예: 컴퓨터공학과)" style="flex: 2;">
        <input type="number" class="dept-max" placeholder="인원수 (예: 3)" style="flex: 1;">
      </div>
    </div>
    <button type="button" onclick="addDeptInput()" style="background:#e9ecef; color:#333; border:none; padding:8px; cursor:pointer; font-weight:bold;">+ 학과 추가하기</button>

    <label style="font-size: 13px; font-weight: bold; margin-top: 10px; display: block;">마감 날짜</label>
    <input type="date" id="deadline">
    <button type="button" style="background:#007bff; color:white; font-weight:bold;" onclick="createPost()">작성 완료</button>
  </div>

  <div class="card-container" id="cardContainer"></div>

  <script>
    const editModes = {};

    async function loadPosts() {
      const res = await fetch('/api/posts');
      const posts = await res.json();
      const container = document.getElementById('cardContainer');
      container.innerHTML = '';

      if (posts.length === 0) {
        return container.innerHTML = `<p style="color:#888; text-align:center; width:100%;">아직 등록된 모집글이 없습니다.</p>`;
      }

      posts.forEach(post => {
        const isEditing = !!editModes[post.id];

        let deptListHtml = '';
        post.departments.forEach(dept => {
          const isDeptFull = dept.currentMembers >= dept.maxMembers;
          deptListHtml += `
            <div class="dept-item">
              <span><strong>${dept.deptName}</strong> (${dept.currentMembers}/${dept.maxMembers})</span>
              ${isEditing ? `
                <button class="btn-dept-approve" onclick="approveDepartment('${post.id}', '${dept.deptName}')" ${isDeptFull ? 'disabled' : ''}>
                  ${isDeptFull ? '완료' : '+1 승인'}
                </button>
              ` : ''}
            </div>`;
        });

        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div>
            <div class="card-title">${post.title}</div>
            <div style="font-size: 12px; color: #888; margin-bottom: 12px;">작성자: ${post.author || '작성자'}</div>
            <div class="dept-list">${deptListHtml}</div>
            <div style="font-size: 12px; color: #555;">마감일: ${post.deadline}</div>
          </div>
          <div style="border-top: 1px solid #eee; margin-top: 10px; padding-top: 10px;">
            <div class="btn-row">
              <button class="btn btn-edit" onclick="toggleEditMode('${post.id}')">${isEditing ? '완료' : '수정 (+인원)'}</button>
              <button class="btn btn-del" onclick="deletePost('${post.id}')">삭제</button>
            </div>
          </div>`;
        container.appendChild(card);
      });
    }

    function addDeptInput() {
      const div = document.createElement('div');
      div.className = 'dept-input-row';
      div.innerHTML = `<input type="text" class="dept-name" placeholder="학과명" style="flex: 2;"><input type="number" class="dept-max" placeholder="인원수" style="flex: 1;">`;
      document.getElementById('deptInputGroup').appendChild(div);
    }

    function toggleEditMode(id) {
      editModes[id] = !editModes[id];
      loadPosts();
    }

    async function approveDepartment(postId, deptName) {
      await fetch(`/api/posts/${postId}/join`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ deptName })
      });
      loadPosts();
    }

    async function createPost() {
      const title = document.getElementById('title').value;
      const author = document.getElementById('author').value;
      const deadline = document.getElementById('deadline').value;
      const deptNames = document.querySelectorAll('.dept-name');
      const deptMaxes = document.querySelectorAll('.dept-max');

      const departments = [];
      deptNames.forEach((input, index) => {
        if (input.value && deptMaxes[index].value) {
          departments.push({ deptName: input.value, maxMembers: deptMaxes[index].value });
        }
      });

      if (!title || departments.length === 0 || !deadline) {
        return alert('모든 필수 항목을 입력해주세요.');
      }

      const res = await fetch('/api/posts', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title, author, departments, deadline })
      });

      if (res.ok) {
        alert('작성되었습니다!');
        document.getElementById('title').value = '';
        document.getElementById('author').value = '';
        document.getElementById('deadline').value = '';
        loadPosts();
      }
    }

    async function deletePost(id) {
      if (confirm('삭제하시겠습니까?')) { 
        await fetch(`/api/posts/${id}`, { method: 'DELETE' }); 
        loadPosts(); 
      }
    }

    loadPosts();
  </script>
</body>
</html>
